name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check required files exist
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/script.js
          test -f wrangler.toml

      - name: Validate package.json and wrangler.toml
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "
            const fs = require('fs');
            const toml = fs.readFileSync('wrangler.toml', 'utf8');
            if (!/pages_build_output_dir\s*=/.test(toml)) {
              console.error('wrangler.toml is missing pages_build_output_dir');
              process.exit(1);
            }
          "
